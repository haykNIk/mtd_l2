# ---------------------------------------------------------------------------
# ЛР4, Docker Compose: два сервиса — WordPress и база данных MariaDB.
#
# Запуск:  docker compose up -d
# Браузер: http://localhost:8080
# Стоп:    docker compose down          (тома с данными сохраняются)
# Стоп+данные: docker compose down -v
#
# ВАЖНО: команда пишется `docker compose` (через пробел, плагин v2),
# а НЕ `docker-compose` (через дефис) — та версия устарела.
# При этом ФАЙЛ по-прежнему называется docker-compose.yml.
#
# @Author: hayknik
# ---------------------------------------------------------------------------

services:
  db:
    image: mariadb
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: wordpress
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: password
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_data:/var/www/html

volumes:
  db_data:
  wp_data:
