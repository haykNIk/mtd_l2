name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.22'

      # Заголовок doctest в репозитории не хранится — скачиваем при каждом запуске CI
      - name: Download doctest
        run: |
          mkdir -p src/tests
          wget -q https://raw.githubusercontent.com/doctest/doctest/refs/heads/master/doctest/doctest.h \
            -O src/tests/doctest.h
          test -s src/tests/doctest.h

      - name: Configure
        run: cmake -S src -B build

      - name: Build
        run: cmake --build build

      # --no-tests=error: если цель tests почему-то не собралась,
      # ctest не должен «молча» завершиться успешно с нулём тестов
      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: figures-executable
          path: build/main
